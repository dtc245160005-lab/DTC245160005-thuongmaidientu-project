name: thuongmaidientu-project

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  frontend:
    name: thuongmaidientu_frontend
  backend:
    name: thuongmaidientu_backend
    internal: true
  monitoring:
    name: thuongmaidientu_monitoring
    internal: true

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  db:
    <<: *common
    image: mysql:8.4
    container_name: thuongmaidientu-db
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      DBADMIN_USER: ${DBADMIN_USER}
      DBADMIN_PASSWORD: ${DBADMIN_PASSWORD}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --local-infile=0
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$APP_DB_USER\" -p\"$$APP_DB_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\" > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  phpmyadmin:
    <<: *common
    image: phpmyadmin:5.2
    container_name: thuongmaidientu-phpmyadmin
    environment:
      TZ: ${TZ}
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://${SERVER_IP}/phpmyadmin/
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  app:
    <<: *common
    build: ./app
    image: thuongmaidientu-app:1.0
    container_name: thuongmaidientu-app
    environment:
      TZ: ${TZ}
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend, monitoring]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nginx:
    <<: *common
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: thuongmaidientu-nginx
    environment:
      TZ: ${TZ}
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend, monitoring]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/stub_status"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  prometheus:
    <<: *common
    image: prom/prometheus:v2.53.0
    container_name: thuongmaidientu-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.external-url=https://${SERVER_IP}/prometheus/
      - --web.route-prefix=/
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  grafana:
    <<: *common
    image: grafana/grafana:11.3.0
    container_name: thuongmaidientu-grafana
    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${SERVER_IP}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [monitoring]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.8.2
    container_name: thuongmaidientu-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks: [monitoring]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  cadvisor:
    <<: *common
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: thuongmaidientu-cadvisor
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [monitoring]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  mysqld-exporter:
    <<: *common
    image: prom/mysqld-exporter:v0.16.0
    container_name: thuongmaidientu-mysqld-exporter
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, monitoring]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  nginx-exporter:
    <<: *common
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: thuongmaidientu-nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on: [nginx]
    networks: [monitoring]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
