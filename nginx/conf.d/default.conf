server_tokens off;

log_format json_log escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","status":$status,'
  '"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

limit_req_zone $binary_remote_addr zone=req_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

map $request_uri $csp_header {
  ~^/(grafana|phpmyadmin|prometheus)(/|$) "";
  default "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'";
}

upstream thuongmaidientu_app {
  server app:3000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  access_log /var/log/nginx/access.log json_log;
  return 301 https://$host$request_uri;
}

server {
  listen 8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  access_log /var/log/nginx/access.log json_log;
  client_max_body_size 2m;
  limit_conn conn_limit 50;

  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy $csp_header always;

  location = /metrics {
    return 404;
  }

  location ~ /\.(?!well-known) {
    deny all;
  }

  location / {
    limit_req zone=req_limit burst=40 nodelay;
    proxy_pass http://thuongmaidientu_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location = /grafana {
    return 301 /grafana/;
  }

  location /grafana/ {
    set $grafana_up http://grafana:3000;
    proxy_pass $grafana_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /grafana/api/live/ {
    set $grafana_up http://grafana:3000;
    proxy_pass $grafana_up;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location = /phpmyadmin {
    return 301 /phpmyadmin/;
  }

  location /phpmyadmin/ {
    auth_basic "Khu vuc quan tri";
    auth_basic_user_file /etc/nginx/.htpasswd;
    client_max_body_size 64m;
    set $pma_up http://phpmyadmin:80;
    rewrite ^/phpmyadmin/(.*)$ /$1 break;
    proxy_pass $pma_up;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /prometheus {
    return 301 /prometheus/;
  }

  location /prometheus/ {
    auth_basic "Khu vuc quan tri";
    auth_basic_user_file /etc/nginx/.htpasswd;
    set $prom_up http://prometheus:9090;
    rewrite ^/prometheus/(.*)$ /$1 break;
    proxy_pass $prom_up;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 8081;
  server_name _;
  access_log off;

  location = /stub_status {
    stub_status;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
  }
}
